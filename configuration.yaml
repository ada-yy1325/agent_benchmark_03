# =============================================================================
# 执行代码
# =============================================================================
execution:
  run_thinking_mode: |
    """
    思考模式跑 8 个基准
    官方参数：temp=0.6, top_p=0.95, top_k=20
    AIME 用 max_tokens=38912，其余 32768
    必须加 filters: {'remove_until': '</think>'}
    """
    from evalscope import TaskConfig, run_task

    BENCHMARKS = [
        # (dataset, extra_args, max_tokens, display_name)
        ("mmlu_redux", {}, 32768, "MMLU-Redux"),
        ("gpqa_diamond", {}, 32768, "GPQA-Diamond"),
        ("ceval", {}, 32768, "C-Eval"),
        ("ifeval", {}, 32768, "IFEval"),
        ("math_500", {}, 32768, "MATH-500"),
        ("aime24", {}, 38912, "AIME'24"),
        ("aime25", {}, 38912, "AIME'25"),
        ("live_code_bench",
         {"subset_list": ["v5"],
          "extra_params": {"start_date": "2024-10-01", "end_date": "2025-02-28"}},
         32768, "LiveCodeBench v5"),
    ]

    for dataset, extra_args, max_tokens, name in BENCHMARKS:
        print(f"\n{'='*50}")
        print(f"[Thinking] Running: {name}")
        print(f"{'='*50}")

        dataset_args = {
            dataset: {
                'filters': {'remove_until': '</think>'},  # 官方思考模式必须过滤
            }
        }
        dataset_args[dataset].update(extra_args)

        task_cfg = TaskConfig(
            model='Qwen3-14B',
            api_url='http://127.0.0.1:8801/v1/chat/completions',
            eval_type='openai_api',
            datasets=[dataset],
            dataset_args=dataset_args,
            eval_batch_size=8,
            generation_config={
                'max_tokens': max_tokens,
                'temperature': 0.6,   # 官方
                'top_p': 0.95,        # 官方
                'top_k': 20,          # 官方
                'n': 1,               # 官方 GPQA=10, AIME=64；先跑 n=1
            },
            timeout=120000,
            stream=True,
            # limit=20,  # 测试时打开
        )
        run_task(task_cfg=task_cfg)

  run_non_thinking_mode: |
    """
    非思考模式跑 8 个基准
    官方参数：temp=0.7, top_p=0.8, top_k=20
    通过 extra_body 关闭思考模式
    """
    from evalscope import TaskConfig, run_task

    BENCHMARKS = [
        ("mmlu_redux", {}, 32768, "MMLU-Redux"),
        ("gpqa_diamond", {}, 32768, "GPQA-Diamond"),
        ("ceval", {}, 32768, "C-Eval"),
        ("ifeval", {}, 32768, "IFEval"),
        ("math_500", {}, 32768, "MATH-500"),
        ("aime24", {}, 38912, "AIME'24"),
        ("aime25", {}, 38912, "AIME'25"),
        ("live_code_bench",
         {"subset_list": ["v5"],
          "extra_params": {"start_date": "2024-10-01", "end_date": "2025-02-28"}},
         32768, "LiveCodeBench v5"),
    ]

    for dataset, extra_args, max_tokens, name in BENCHMARKS:
        print(f"\n{'='*50}")
        print(f"[Non-thinking] Running: {name}")
        print(f"{'='*50}")

        dataset_args = {dataset: extra_args}  # 非思考模式不需要过滤

        task_cfg = TaskConfig(
            model='Qwen3-14B',
            api_url='http://127.0.0.1:8801/v1/chat/completions',
            eval_type='openai_api',
            datasets=[dataset],
            dataset_args=dataset_args,
            eval_batch_size=16,
            generation_config={
                'max_tokens': max_tokens,
                'temperature': 0.7,   # 官方
                'top_p': 0.8,         # 官方
                'top_k': 20,          # 官方
                'n': 1,
                'extra_body': {
                    'chat_template_kwargs': {'enable_thinking': False}  # 官方关闭思考
                },
            },
            timeout=120000,
            stream=True,
        )
        run_task(task_cfg=task_cfg)

# =============================================================================
# 官方分数核对清单（你翻 PDF 表15/16 后填）
# =============================================================================
official_score_checklist:
  pdf: "https://arxiv.org/pdf/2505.09388"
  thinking_table: "Table 15: Qwen3-30B-A3B / Qwen3-14B (Thinking)"
  non_thinking_table: "Table 16: Qwen3-30B-A3B / Qwen3-14B (Non-thinking)"
  find_qwen3_14b_column: "在表中找到 Qwen3-14B 列，把分数填入 runnable_benchmarks 的 official_score 字段"

  benchmarks_to_fill:
    - "MMLU-Redux"
    - "GPQA-Diamond"
    - "C-Eval"
    - "IFEval (strict prompt)"
    - "MATH-500"
    - "AIME'24"
    - "AIME'25"
    - "LiveCodeBench"

# =============================================================================
# 注意事项（对照官方内容确认）
# =============================================================================
important_notes:
  - "Instruct 评测全部 0-shot，不要加 few_shot_num（和 Base 模型的 15 基准不同）"
  - "思考模式必须加 filters: {'remove_until': '</think>'}，过滤思考过程只评最终答案"
  - "AIME'24/25 的 max_tokens 必须用 38912，不是 32768（官方明确说扩展）"
  - "GPQA 官方是 n=10 采样平均，AIME 官方是 n=64 采样平均；先跑 n=1 成本低，分数会偏低属正常"
  - "LiveCodeBench 思考模式官方调整了 prompt 模板（移除'只能返回程序'限制），EvalScope 默认 prompt 可能不完全一致"
  - "MMMLU 官方只采样 10% 数据，EvalScope 默认跑全量，分数可能有差异"
  - "presence_penalty=1.5 只用于 Creative Writing V3 和 WritingBench，这两个 EvalScope 跑不了，所以你的配置里不需要加"
  - "BFCL v3 需要 64k 上下文 + FC 格式，EvalScope 不支持，需用官方 harness"
